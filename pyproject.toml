[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sffmt"
authors = [
    { name = "Paresh Adhia", email = "padhia@gmail.com" },
]
description = "Format SQL statements"
readme = "README.md"
requires-python = ">=3.14"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [ "sqlglot" ]
dynamic = ["version"]

[project.scripts]
sffmt = "sffmt:main"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["sffmt"]

[tool.setuptools.dynamic]
version = { attr = "sffmt.__version__" }

[tool.ruff]
target-version = "py314"
line-length = 130
lint.extend-select = ["I"]
